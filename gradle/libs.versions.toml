[versions]
agp = "9.0.1"
kotlin = "2.3.21"
dokka = "2.2.0"
kotlinx-binaryCompatibilityValidator = "0.18.1"
compose-bom = "2026.05.01"
compose = "1.11.0"
jetpack-activity = "1.13.0"
jetpack-lifecycle = "2.10.0"
jetpack-navigation = "2.9.8"
kotlinx-io = "0.9.0"
slf4j-api = "2.0.18"
test-junit = "6.1.0"
test-assertk = "0.28.1"
test-mockito = "6.3.0"
test-screenshot = "0.0.1-alpha15"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-text = { module = "org.jetbrains.compose.ui:ui-text", version.ref = "compose" }
compose-ui-testManifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-textGoogleFonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-runtime-tracing = { module = "androidx.compose.runtime:runtime-tracing" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
jetpack-activity = { module = "androidx.activity:activity-compose", version.ref = "jetpack-activity" }
jetpack-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetpack-lifecycle" }
jetpack-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "jetpack-navigation" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
test-junit-bom = { module = "org.junit:junit-bom", version.ref = "test-junit" }
test-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
test-junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
test-assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "test-assertk" }
test-mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "test-mockito" }
test-android-screenshot-validationApi = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "test-screenshot"}
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
plugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }

[bundles]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-screenshot = { id = "com.android.compose.screenshot", version.ref = "test-screenshot" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlinx-binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "kotlinx-binaryCompatibilityValidator" }
